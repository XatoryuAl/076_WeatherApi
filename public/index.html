<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>

<script src="https://cdn.maptiler.com/maptiler-sdk-js/v3.2.0/maptiler-sdk.umd.min.js"></script>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v3.2.0/maptiler-sdk.css" rel="stylesheet">

<style>
    #map {
        width: 100%;
        height: 450px;
        margin-top: 20px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
    }

    button:hover {
        background-color: #0056b3;
    }
</style>

</head>

<body>

Aplikasi Geologis

<h3>Nama : Muh.Aldyansyah Putra Jaya  </h3>
<h3>NIM : 20240140076 </h3>

<p>
    Kota :
    <span id="lokasi">-</span>
</p>

<hr>

<p>
    Koordinat :
    <span id="koordinat">-</span>
</p>

<button id="btnPilihLokasi">
   PILIH LOKASI
</button>

<div id="map"></div>

<script>
    fetch("/api/lokasi")
    .then(response => response.json())
    .then(data => {
        console.log(data);

        document.getElementById("lokasi").innerHTML = data.kota;
        document.getElementById("koordinat").innerHTML = data.koordinat;
    })
    .catch(error => {
        console.error(error);
    });

    maptilersdk.config.apiKey = "TmW3n2IbOKaZxkghOoYB";

    let longitude = 106.8456;
    let latitude = -6.2088;

    const map = new maptilersdk.Map({

        container: "map",

        style: maptilersdk.MapStyle.STREETS,

        center: [
            longitude,
            latitude
        ],

        zoom: 11
    });

    const marker = new maptilersdk.Marker({
        draggable: true
    })
    .setLngLat([
        longitude,
        latitude
    ])
    .addTo(map);

    function pilihLokasi(lon, lat) {

        marker.setLngLat([
            lon,
            lat
        ]);

        map.flyTo({
            center: [
                lon,
                lat
            ],
            zoom: 15
        });

        document.getElementById("koordinat").innerHTML =
            `[${lon}, ${lat}]`;

        fetch(
            `/api/pilih-lokasi?lat=${lat}&lon=${lon}`
        )

        .then(response => response.json())

        .then(data => {

            console.log(data);

            document.getElementById("lokasi").innerHTML =
                data.kota;

            document.getElementById("koordinat").innerHTML =
                data.koordinat;

        })

        .catch(error => {

            console.error(error);

        });
    }

    map.on("click", function(e) {

        const lon = e.lngLat.lng;
        const lat = e.lngLat.lat;

        pilihLokasi(lon, lat);

    });

    marker.on("dragend", function() {

        const posisi = marker.getLngLat();

        pilihLokasi(
            posisi.lng,
            posisi.lat
        );

    });

    document
        .getElementById("btnPilihLokasi")
        .addEventListener("click", function() {

            alert(
                "Silakan klik lokasi yang kamu inginkan pada peta."
            );

        });

</script>
</body>
</html>
